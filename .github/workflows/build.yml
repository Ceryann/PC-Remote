name: Build PCRemote.exe

on:
  workflow_dispatch:   # tombol "Run workflow" manual
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15   # supaya tidak menggantung berjam-jam
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi (tanpa vgamepad)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn websockets pyautogui qrcode pyinstaller

      - name: Pasang vgamepad tanpa menjalankan setup-nya
        shell: pwsh
        run: |
          $info = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.2.0/json
          $url = ($info.urls | Where-Object { $_.packagetype -eq 'sdist' }).url
          Invoke-WebRequest $url -OutFile vg.tar.gz
          mkdir vg
          tar -xzf vg.tar.gz -C vg
          $pkg = Get-ChildItem vg -Recurse -Directory -Filter vgamepad | Select-Object -First 1
          $site = python -c "import site; print(site.getsitepackages()[0])"
          Copy-Item $pkg.FullName "$site\vgamepad" -Recurse
          # Jangan di-import di sini: vgamepad butuh driver ViGEmBus saat di-import.
          $dll = Get-ChildItem "$site\vgamepad" -Recurse -Filter ViGEmClient.dll
          if (-not $dll) { throw "ViGEmClient.dll tidak ditemukan di paket vgamepad" }
          $dll | ForEach-Object { Write-Host "Ditemukan: $($_.FullName)" }

      - name: Bungkus jadi satu .exe
        shell: pwsh
        run: |
          $site = python -c "import site; print(site.getsitepackages()[0])"
          pyinstaller --onefile --name PCRemote --add-data "index.html;." --add-data "$site\vgamepad;vgamepad" --collect-submodules uvicorn server.py

      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote
          path: dist/PCRemote.exe
