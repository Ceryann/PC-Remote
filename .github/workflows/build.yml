# ==============================================================================
# DOKUMENTASI WORKFLOW: Build PCRemote.exe dengan Ikon Kustom
# ==============================================================================

name: Build PCRemote.exe

# Pemicu otomatis & manual kapan workflow ini dijalankan
on:
  workflow_dispatch:   # Memunculkan tombol "Run workflow" manual di tab Actions
  push:
    branches: [main]   # Otomatis berjalan setiap ada perubahan kode di branch main
  release:
    types: [published] # Saat Release baru diterbitkan, .exe otomatis dilampirkan

# Izin agar workflow bisa melampirkan file ke halaman Release GitHub
permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest  # Menggunakan server Windows agar menghasilkan .exe
    timeout-minutes: 15      # Batas waktu maksimal agar tidak menggantung

    steps:
      # 1. Mengambil seluruh file dari repository ke server build
      - name: Ambil kode repository
        uses: actions/checkout@v4

      # 2. Menyiapkan lingkungan Python 3.11
      - name: Siapkan Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # 3. Menginstal library utama aplikasi beserta PyInstaller
      - name: Pasang dependensi (tanpa vgamepad)
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn websockets pyautogui qrcode pyinstaller

      # 4. Mengunduh dan menyalin paket vgamepad tanpa memicu instalasi driver ViGEmBus
      - name: Pasang vgamepad tanpa menjalankan setup-nya
        shell: pwsh
        run: |
          $info = Invoke-RestMethod https://pypi.org/pypi/vgamepad/0.2.0/json
          $url = ($info.urls | Where-Object { $_.packagetype -eq 'sdist' }).url
          Invoke-WebRequest $url -OutFile vg.tar.gz
          mkdir vg
          tar -xzf vg.tar.gz -C vg
          $pkg = Get-ChildItem vg -Recurse -Directory -Filter vgamepad | Select-Object -First 1
          $site = python -c "import site; print(site.getsitepackages()[0])"
          Copy-Item $pkg.FullName "$site\vgamepad" -Recurse
          # Jangan di-import di sini: vgamepad butuh driver ViGEmBus saat di-import.
          $dll = Get-ChildItem "$site\vgamepad" -Recurse -Filter ViGEmClient.dll
          if (-not $dll) { throw "ViGEmClient.dll tidak ditemukan di paket vgamepad" }
          $dll | ForEach-Object { Write-Host "Ditemukan: $($_.FullName)" }

      # 5. Membungkus server.py menjadi PCRemote.exe lengkap dengan ikon PCRemote.ico
      - name: Bungkus jadi satu .exe
        shell: pwsh
        run: |
          # Validasi awal: memastikan file PCRemote.ico benar-benar ada di repository
          if (-not (Test-Path "PCRemote.ico")) {
            throw "File PCRemote.ico tidak ditemukan di folder utama repository!"
          }

          $site = python -c "import site; print(site.getsitepackages()[0])"
          pyinstaller --onefile `
            --name PCRemote `
            --icon="PCRemote.ico" `
            --add-data "index.html;." `
            --add-data "PCRemote.ico;." `
            --add-data "$site\vgamepad;vgamepad" `
            --collect-submodules uvicorn `
            server.py

      # 6. Membuat kode verifikasi keamanan SHA256 untuk file .exe
      - name: Hitung SHA256
        shell: pwsh
        run: |
          $h = (Get-FileHash dist/PCRemote.exe -Algorithm SHA256).Hash.ToLower()
          "$h  PCRemote.exe" | Out-File -Encoding ascii dist/PCRemote.exe.sha256
          "SHA256 PCRemote.exe: $h" | Out-File -Append -Encoding utf8 $env:GITHUB_STEP_SUMMARY

      # 7. Menyimpan hasil build sementara agar bisa diunduh dari halaman Actions
      - name: Simpan hasil build sebagai Artifact
        uses: actions/upload-artifact@v4
        with:
          name: PCRemote
          path: |
            dist/PCRemote.exe
            dist/PCRemote.exe.sha256

      # 8. Melampirkan file .exe dan .sha256 ke halaman Release jika dipicu oleh rilis baru
      - name: Lampirkan ke Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/PCRemote.exe
            dist/PCRemote.exe.sha256
