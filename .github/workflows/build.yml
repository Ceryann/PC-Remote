name: Build PCRemote.exe

on:
  workflow_dispatch:   # tombol "Run workflow" manual
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pasang dependensi
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Bungkus jadi satu .exe
        run: pyinstaller --onefile --name PCRemote --add-data "index.html;." --collect-all vgamepad --collect-submodules uvicorn server.py

      - uses: actions/upload-artifact@v4
        with:
          name: PCRemote
          path: dist/PCRemote.exe
